<div class="w-[22vw] 
        max-w-[300px] 
        min-w-[100px] 
        h-[300px] 
        mt-[30px] 
        relative z-[2] 
        text-center 
        flex flex-col">
    <br/><br/><br/>
    <form [formGroup]="form" (ngSubmit)="onSubmit()"
            class="flex 
                flex-col
                gap-[clamp(8px,2vh,24px)]">
        <h5 class="text-center 
                w-full 
                max-w-[182px]
                mx-auto">
            {{ 'LOGIN' | t:'forms/login-form' }}
        </h5>
        <input  
            class="border-2 
                border-black
                w-full"
            type="text" 
            formControlName="login"
        >
    
        <h5 class="text-center 
                w-full 
                max-w-[182px]
                mx-auto">
            {{ 'PASSWORD' | t:'forms/login-form' }}
        </h5>
        <input 
            class="border-2 
                border-black
                w-full" 
            type="password" 
            formControlName="password"
        >

        <button 
            type="submit" 
            class="border-2 
                border-black 
                p-0 
                w-full 
                max-w-[182px] 
                mx-auto 
                bg-[rgba(0,0,135,0.2)] 
                mt-[clamp(8px,3vh,30px)] 
                hover:bg-blue-600 
                text-black">
                {{ 'SINGIN' | t:'forms/login-form' }}
            </button>
    </form>
    <br/>
</div>
